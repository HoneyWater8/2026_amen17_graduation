<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>방식 2 · 허브형 — 아멘 17기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100dvh;overflow:hidden;background:#050E1C;font-family:'Pretendard',-apple-system,sans-serif;color:#EAF4F6}
#root{height:100dvh}
.gs-scroll{scrollbar-width:none;-ms-overflow-style:none}
.gs-scroll::-webkit-scrollbar{width:0;height:0;display:none}
a{color:#7FE9E0}a:hover{color:#FFD98A}
button{font-family:inherit}
@keyframes hbSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes hbSpinRev{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes hbFloat{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-16px);opacity:.95}}
@keyframes hbPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@keyframes hbFadeIn{from{opacity:0}to{opacity:1}}
@keyframes hbSlideUp{from{transform:translateY(100%)}to{transform:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="grad-data.js"></script>
<script type="text/babel" src="grad-n2-hub-app.jsx"></script>
</body>
