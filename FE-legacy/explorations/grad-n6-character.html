<head>

<title>방식 6 · 캐릭터 여정 — 아멘 17기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100dvh;overflow:hidden;background:#FBE05A;font-family:'Pretendard',-apple-system,sans-serif;color:#3A3226}
#root{height:100dvh}
.gs-scroll{scrollbar-width:none;-ms-overflow-style:none}
.gs-scroll::-webkit-scrollbar{width:0;height:0;display:none}
a{color:#EF6F5E}a:hover{color:#3D6FA6}
button{font-family:inherit}
@keyframes chBob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:1}}
@keyframes chPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes chFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(120vh) rotate(420deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
